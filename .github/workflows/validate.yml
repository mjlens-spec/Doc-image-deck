name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"          # Windows runners print through cp1252 otherwise

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check launcher syntax
        if: runner.os == 'Linux'
        run: sh -n scripts/deck
      - name: Run tests
        run: python tests/run_tests.py

  windows-pipeline:
    # Full setup on Windows (no PowerPoint or Codex on the runner), then the pipeline on a synthetic slide:
    # PDF extraction, RapidOCR, font fitting, LaMa on the CPU, PPTX assembly, per-user font installation.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skill for Claude Code and Codex (junctions)
        run: python scripts/install.py --no-setup
      - name: Check skill links
        shell: pwsh
        run: |
          foreach ($h in '.claude', '.codex') {
            if (-not (Test-Path "$env:USERPROFILE\$h\skills\doc-image-deck\SKILL.md")) { throw "missing link in $h" }
          }
      - name: Set up runtime
        shell: cmd
        run: scripts\deck.cmd setup --no-calib || exit /b 0
      - name: Check report
        run: python tests/ci_check_report.py
      - name: Pipeline smoke test
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\doc-image-deck\venv\Scripts\python.exe" tests\pipeline_smoke.py'
